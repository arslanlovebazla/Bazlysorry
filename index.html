        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body { margin: 0; font-family: 'Poppins', sans-serif; background: var(--cream); color: #333; overflow-x: hidden; scroll-behavior: smooth; }

        /* --- Floating Stars --- */
        .star { position: fixed; color: var(--gold); font-size: 14px; animation: flash 3s infinite ease-in-out; z-index: -1; }
        @keyframes flash { 0%, 100% { opacity: 0.3; transform: scale(0.8); } 50% { opacity: 1; transform: scale(1.2); } }

        /* --- Page 1: Entrance --- */
        #entrance { 
            height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; 
            background: linear-gradient(rgba(44, 0, 12, 0.9), rgba(88, 0, 24, 0.95)); 
            text-align: center; padding: 20px; color: white;
        }
        .eid-moon { font-size: 60px; margin-bottom: 10px; animation: float 3s infinite ease-in-out; }
        #entrance h1 { font-family: 'Cinzel', serif; font-size: 2rem; color: var(--gold); }
        
        #giftBtn { 
            background: var(--gold); color: var(--maroon); border: none; padding: 15px 40px; 
            border-radius: 50px; font-size: 18px; font-weight: bold; cursor: pointer; margin-top: 20px;
            box-shadow: 0 10px 25px rgba(212, 175, 55, 0.4); animation: pulse 1.5s infinite;
        }

        /* --- Main Content --- */
        #mainContent { display: none; padding-bottom: 60px; }
        
        .box-card { 
            background: white; padding: 35px 25px; border-radius: 30px; 
            margin: 30px auto; max-width: 550px; width: 90%;
            border: 1px solid rgba(212, 175, 55, 0.3); 
            box-shadow: 0 15px 35px rgba(88, 0, 24, 0.05); text-align: center;
        }
        .box-card h3 { font-family: 'Great Vibes', cursive; font-size: 2.5rem; color: var(--maroon); margin-top: 0; }
        .poetry-line { font-size: 1.1rem; margin-bottom: 12px; line-height: 1.7; color: #444; font-weight: 500; }

        /* --- Poll Section --- */
        .poll-container { display: flex; flex-direction: column; gap: 15px; margin-top: 25px; }
        .poll-option { 
            background: #fff; border: 2px solid #ddd; padding: 15px 20px; 
            border-radius: 20px; font-size: 1.1rem; font-weight: 600; cursor: pointer; 
            transition: 0.3s ease; display: flex; align-items: center; justify-content: space-between;
        }
        .poll-option:hover { border-color: var(--pink); background: #fff0f3; }
        .poll-option.selected { background: var(--maroon); color: white; border-color: var(--maroon); }
        .special-option { border: 2px dashed var(--gold); background: #fffdf5; color: var(--maroon); }
        .special-option:hover { background: #fdf5d6; border-color: var(--gold); }

        /* --- Photo Grid --- */
        .grid-container { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; padding: 20px; max-width: 600px; margin: 0 auto; }
        .grid-container img { width: 100%; height: 180px; object-fit: cover; border-radius: 20px; box-shadow: 0 5px 15px rgba(0,0,0,0.05); }
